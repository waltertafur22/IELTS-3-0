${[1,2,3,4].map(p=>{const l=A.filter(a=>a.p==p&&(f=='All'||a.l==f)&&(ty=='All'||a.q.some(q=>q.ty==ty)));return `<h2>Part ${p}: ${['Everyday conversation','Everyday monologue','Academic conversation','Academic lecture'][p-1]}</h2><div class="g">${l.map(card).join('')||'<p>No activities match these filters.</p>'}</div>`}).join('')}`},
act(id){const a=A.find(x=>x.id==id);if(!a)return nv('practice');
$('#m').innerHTML=`<a href="#practice" onclick="nv('practice');return false">← All activities</a><h1>Practice mode</h1>${actHtml(a,0)}<p><button id="sb" onclick="subA(${id})">Submit answers</button></p><div id="rs"></div>`},
mock(){const ids=[2,4,5,8];$('#m').innerHTML=`<h1>Mock test (exam simulation)</h1><p>4 sections, 16 questions, 12 minutes. Each recording plays once. Transcripts and explanations appear only after you submit. This shortened mock is for practice and is not an official test.</p><button id="st" onclick="startMock()">Start mock test</button><div id="mk"></div>`},
mist(){$('#m').innerHTML=`<h1>Mistake review</h1>${S.mi.length?S.mi.slice().reverse().map(m=>{const [id,i]=m.n.split('_'),a=A.find(x=>x.id==id),q=a.q[i];return `<div class="c" style="margin:8px 0"><span class="tag">${a.t}</span><span class="tag">${q.ty}</span><p><b>${q.q}</b></p><p class="bad">You answered: ${m.g}</p><p class="ok">Correct: ${ans(q)}</p><p>${q.w}</p><a class="btn" href="#act/${id}" onclick="nv('act/${id}');return false">Retry activity</a></div>`}).join(''):'<p>No mistakes recorded. Complete an activity to start tracking.</p>'}`},
prog(){const row=(k,v)=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td><td>${acc(v)}</td></tr>`;
const bd=[['First step',Object.keys(S.done).length>0],['100 XP',S.xp>=100],['3-day streak',S.st>=3],['Perfect score',Object.values(S.done).some(d=>d.s==d.t)],['All activities',Object.keys(S.done).length==A.length]];
$('#m').innerHTML=`<h1>My progress</h1><div class="g"><div class="c"><div class="big">Level ${lvl()}</div>${S.xp} XP</div><div class="c"><div class="big">${S.st}</div>day streak</div></div>
<h2>Badges</h2><p>${bd.map(b=>`<span class="tag" style="opacity:${b[1]?1:.4}">${b[1]?'🏅':'🔒'} ${b[0]}</span>`).join('')}</p>
<h2>By part</h2><table><tr><th>Part</th><th>Correct</th><th>Accuracy</th></tr>${[1,2,3,4].map(p=>row('Part '+p,S.pt[p]||[0,0])).join('')}</table>
<h2>By question type</h2><table><tr><th>Type</th><th>Correct</th><th>Accuracy</th></tr>${Object.entries(S.ty).map(([k,v])=>row(k,v)).join('')||'<tr><td colspan=3>No data yet</td></tr>'}</table>
<h2>Recent activity</h2><table>${S.h.map(h=>`<tr><td>${h.d}</td><td>${(A.find(a=>a.id==h.id)||{}).t}</td><td>${h.m}</td><td>${h.s}/${h.t}</td></tr>`).join('')||'<tr><td>Nothing yet</td></tr>'}</table>
<p><small>Data is saved in this browser only (local storage).</small></p><button class="s" onclick="if(confirm('Delete all progress on this browser? This cannot be undone.')){localStorage.removeItem(K);location.reload()}">Reset progress</button>`},
tips(){const t=[['Predict before you listen','Read the questions first. Decide whether you need a name, number, date or adjective.'],['Expect distractors','Speakers often correct themselves: “Thursday… no, Tuesday”. The final version is the answer.'],['Follow signposts','Listen for “firstly”, “however”, “in fact”, “moving on”. They tell you where the next answer is.'],['Watch the word limit','“NO MORE THAN TWO WORDS” means three words is wrong, even if the idea is right.'],['Listen for paraphrases','“next to” = “beside”; “quicker” = “faster”. Questions rarely repeat the audio word for word.'],['Numbers and spelling','Practise double digits (“double nine”), teens vs tens (fourteen / forty) and common spellings. Spelling counts.'],['Check your answers','Check singular/plural forms, capital letters for names and grammar fit.']];
$('#m').innerHTML=`<h1>IELTS Listening tips</h1>${t.map(x=>`<div class="c" style="margin:8px 0"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}<p><b>Band estimates:</b> the mock converts your raw score to a scale of 40 and uses a commonly published Academic Listening conversion table. Real bands vary by test version.</p>`}};
function subA(id){const r=grade([id],0);$('#sb').disabled=true;$('#rs').innerHTML=`<div class="res"><h2>Score: ${r.c}/${r.t} · +${r.xp} XP</h2><p>${msg(r.c/r.t)}</p><button onclick="nv('act/${id}')">Retry</button> <button class="s" onclick="nv('mist')">Review mistakes</button> <button class="s" onclick="nv('prog')">My progress</button></div>`;$('#rs').scrollIntoView({behavior:'smooth'})}
const MK=[2,4,5,8];
function startMock(){plays={};Q.x=0;$('#st').remove();T=12*60;$('#mk').innerHTML=`<div class="tm" id="tmr">12:00</div>${MK.map(id=>`<h2>Section ${A.find(a=>a.id==id).p}</h2>`+actHtml(A.find(a=>a.id==id),1)).join('')}<p><button id="fs" onclick="finMock()">Submit final answers</button></p><div id="rs"></div>`;
TT=setInterval(()=>{T--;$('#tmr').textContent=Math.floor(T/60)+':'+String(T%60).padStart(2,'0');if(T<=0)finMock(1)},1000)}
function finMock(auto){if(!auto&&!confirm('Submit your final answers? You cannot change them afterwards.'))return;clearInterval(TT);sp&&sp.cancel();const r=grade(MK,1),b=band(r.c,r.t);$('#fs').disabled=true;
$('#rs').innerHTML=`<div class="res"><h2>Score: ${r.c}/${r.t} · +${r.xp} XP</h2><p>Scaled to 40: about ${b.r}/40 → approximate band ${b.b}. This is an estimate from a scaled conversion, not an official IELTS band.</p><p>${msg(r.c/r.t)}</p><button onclick="nv('mock')">New attempt</button> <button class="s" onclick="nv('mist')">Review mistakes</button></div>`;$('#rs').scrollIntoView({behavior:'smooth'})}
function go(){const [p,a]=cur.split('/');sp&&sp.cancel();clearInterval(TT);P.on=0;plays={};(R[p]||R.home)(a);nav(p);scrollTo(0,0)}
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'home';if(h!=cur){cur=h;go()}});sp&&sp.getVoices();try{go()}catch(e){$('#m').textContent='Something went wrong. Reload the page.'}
</script></body></html>
